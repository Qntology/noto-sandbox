# macOS / Linux / Windows verification of the workspace: `_cargo.sh <backend> test` runs the steps of
# test_runner.bat through test_runner.sh, its bash twin, on every OS.
#
# GitHub-hosted runners have no discrete GPU. So only what can really run is run:
#   mac-metal-arm, mac-vulkan-arm (macos-15): the paravirtual Apple GPU runs the models for real, Vulkan through MoltenVK
#                    (step 07 compares them with the CPU; a job that opens no device fails, it never skips)
#   mac-metal, mac-vulkan (macos-15-intel): build only. That GPU opens, but Metal gives other numbers and MoltenVK aborts;
#                    mac-metal also runs the unit tests (step 02), where noto_ml refuses that device
#   mac-cpu (macos-14) : Apple Silicon, no Metal device on that image
#   cpu            : every step, then the integration tests test_runner.bat does not list
#   vulkan (Linux) : lavapipe (software Vulkan, a CPU device): every step, step 07 on that device
#   vulkan (Win)   : build only (no software Vulkan ICD is installed) — reported as "build only"
#   cuda / rocm    : type check only (`cargo check`, as check_cuda.bat / check_rocm.bat); never executed, never
#                    reported as a pass of a run. cuda builds its kernels with a real nvcc.
# Real CUDA / ROCm / Windows-GPU execution and the #[ignore] tests with real weights need a self-hosted runner.
#
# macOS labels, measured 2026-11-02: macos-15 and macos-26 (Apple Silicon) were short of runners by day (14-18 UTC): jobs
# ended cancelled after 15-40 minutes with "not acquired by Runner", which fails the run; at 22-24 UTC they started at once.
# macos-14 and macos-15-intel start within seconds. So the Apple Silicon GPU jobs stay out of the push runs: they run
# when named (`[targets: mac-metal-arm,mac-vulkan-arm]`) and once a day.
name: cross-verify

on:
  # Every push to any branch runs all targets. A workflow file that is not on the
  # default branch cannot be dispatched, so the working branch is triggered by push as well.
  # `[skip ci]` in the head commit message skips it. A line `[targets: windows-cpu,mac-metal]` in the head commit
  # message runs only those jobs (no duplicate runs of what did not change); workflow_dispatch takes the same list.
  push:
    branches: ["**"]
  schedule:
    - cron: "23 22 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: "comma list of: mac-cpu, mac-metal, mac-vulkan, linux-cpu, linux-vulkan, linux-cuda, linux-rocm, windows-cpu, windows-vulkan, windows-cuda, windows-rocm, or mac-metal-arm, mac-vulkan-arm, which only run when named (all = every one but those)"
        default: "all"

concurrency:
  group: cross-verify-${{ github.ref }}
  # A new push replaces the run of a working branch; every commit of main keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # One toolchain for every OS and every run. Raise it here, in one place, and the cache keys follow.
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # No debug info: the test binaries link lancedb, candle and tokenizers each and have to fit the runner disk and cache.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"
  # The macOS runner has 3 cores and 7 GB; test_runner.bat explains why links must not all run at once.
  CARGO_BUILD_JOBS: "3"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TARGETS: ${{ inputs.targets || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # stdout of the script = the matrix (GITHUB_OUTPUT); stderr = a human line, shown as an annotation either way
          python3 - > "$RUNNER_TEMP/plan.out" 2> "$RUNNER_TEMP/plan.err" <<'PY' || { echo "::error title=plan::$(cat "$RUNNER_TEMP/plan.err")"; exit 1; }
          import json, os, re, sys
          t = os.environ.get("TARGETS", "").strip()
          if not t:
              # Only a line that holds nothing but the token counts (prose that mentions `[targets: ...]` must not
              # select anything); with several such lines the last one wins.
              found = re.findall(r"(?m)^[ \t]*\[targets:[ \t]*([^\]\n]+)\][ \t]*$", os.environ.get("COMMIT_MSG", ""))
              t = found[-1] if found else "all"
          t = t.replace(" ", "")
          want = None if t == "all" else set(t.split(","))
          inc = [
            dict(name="mac-cpu", os="macos-14", kind="run", backend="cpu"),
            # The Intel runner's paravirtual GPU opens, but Metal gives other numbers than the CPU and MoltenVK aborts.
            dict(name="mac-metal", os="macos-15-intel", kind="build", backend="metal", only="02"),
            dict(name="mac-vulkan", os="macos-15-intel", kind="build", backend="vulkan"),
            dict(name="linux-cpu", os="ubuntu-latest", kind="run", backend="cpu"),
            dict(name="linux-vulkan", os="ubuntu-latest", kind="run", backend="vulkan"),
            dict(name="linux-cuda", os="ubuntu-latest", kind="check", backend="cuda"),
            dict(name="linux-rocm", os="ubuntu-latest", kind="check", backend="rocm"),
            dict(name="windows-cpu", os="windows-latest", kind="run", backend="cpu"),
            dict(name="windows-vulkan", os="windows-latest", kind="build", backend="vulkan"),
            # CUDA 13 + the newest MSVC, the combination of logis-center's windows-cuda job.
            # sm_80, not sm_75: candle-kernels 0.11.0 compatibility.cuh defines __hmax_nan / __hmin_nan for
            # __CUDA_ARCH__ < 800, and the CUDA 13.2 headers already define them -> "already been defined".
            dict(name="windows-cuda", os="windows-latest", kind="check", backend="cuda", cuda="13.2.0"),
            dict(name="windows-rocm", os="windows-latest", kind="check", backend="rocm"),
          ]
          named = [
            dict(name="mac-metal-arm", os="macos-15", kind="run", backend="metal"),
            dict(name="mac-vulkan-arm", os="macos-15", kind="run", backend="vulkan"),
          ]
          if os.environ.get("EVENT") == "schedule":
              want = {i["name"] for i in named}
          unknown = (want or set()) - {i["name"] for i in inc + named}
          if unknown:
              print("unknown targets: " + ",".join(sorted(unknown)) + "  (valid: " + ",".join(i["name"] for i in inc + named) + ")", file=sys.stderr)
              sys.exit(1)
          inc = inc if want is None else [i for i in inc + named if i["name"] in want]
          print("targets: " + ",".join(i["name"] for i in inc), file=sys.stderr)
          print("matrix=" + json.dumps({"include": inc}))
          PY
          cat "$RUNNER_TEMP/plan.out" >> "$GITHUB_OUTPUT"
          echo "::notice title=targets::$(cat "$RUNNER_TEMP/plan.err")"

  steps-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: test_runner.bat and test_runner.sh list the same steps
        shell: bash
        run: |
          diff <(grep -oE 'call :(run|bench) [0-9]{2} [a-z_]+' test_runner.bat | awk '{print $3, $4}' | sort -n) \
               <(grep -oE '^ *(run|bench) [0-9]{2} [a-z_]+' test_runner.sh | awk '{print $2, $3}' | sort -n) \
            || { echo "::error title=steps::test_runner.bat and test_runner.sh differ (< .bat, > .sh)"; exit 1; }

  cross:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      # rocm: hipcc is not installed on the runner; the build script writes empty kernel images.
      CANDLE_ROCM_SKIP_KERNEL_BUILD: "1"
      # cuda: no GPU to detect the compute capability from (Ampere, the lowest the kernels build for on CUDA 13).
      CUDA_COMPUTE_CAP: "80"
    steps:
      - uses: actions/checkout@v7
      - name: environment report (runner, before setup)
        run: bash .github/scripts/env-report.sh before-setup
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      # Keeps ~/.cargo and the dependencies of target/, without the workspace crates and the test binaries: eleven
      # complete target directories do not fit the 10 GB of a repository. Saved after a failed job too.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}-rust${{ env.RUST_VERSION }}
          cache-on-failure: true
      - name: Tauri system libraries (Linux; macOS / Windows need none)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: macOS — MoltenVK
        if: matrix.name == 'mac-vulkan-arm'
        run: |
          brew install molten-vk vulkan-loader vulkan-tools >/dev/null 2>&1 || brew install molten-vk vulkan-loader vulkan-tools
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
      - name: software Vulkan (lavapipe)
        if: matrix.name == 'linux-vulkan'
        run: |
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          echo "CANDLE_VULKAN_ALLOW_CPU=1" >> "$GITHUB_ENV"
      - name: CUDA toolkit (apt nvcc for the kernel build; no GPU)
        if: matrix.name == 'linux-cuda'
        run: sudo apt-get install -y -qq nvidia-cuda-toolkit
      - name: CUDA toolkit (Windows; all components — no GPU)
        if: matrix.name == 'windows-cuda'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network
      - name: MSVC developer environment (nvcc needs cl.exe in PATH)
        if: matrix.name == 'windows-cuda'
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: CUDA with MSVC — the settings of _env_cuda.bat
        if: matrix.name == 'windows-cuda'
        run: |
          # Git for Windows link.exe shadows MSVC link.exe once the MSVC environment is on PATH.
          if [ -f /usr/bin/link.exe ]; then mv /usr/bin/link.exe /usr/bin/link_git.exe; fi
          echo "NVCC_CCBIN=$(where.exe cl | head -1 | tr -d '\r')" >> "$GITHUB_ENV"
          echo "NVCC_PREPEND_FLAGS=-Xcompiler /Zc:preprocessor" >> "$GITHUB_ENV"

      - name: environment report (after setup, before build)
        run: bash .github/scripts/env-report.sh before-build

      # ── run: every step of test_runner.sh; build: step 01 only ──
      - name: build + test steps (test_runner.sh)
        if: matrix.kind != 'check'
        timeout-minutes: 210
        env:
          ONLY: ${{ matrix.only || (matrix.kind == 'build' && '01' || '') }}
          REST: ${{ matrix.backend == 'cpu' && '1' || '' }}
        run: bash _cargo.sh "${{ matrix.backend }}" test

      # ── check: type check only ──
      - name: type check (cargo check — not executed)
        if: matrix.kind == 'check'
        timeout-minutes: 120
        run: |
          set +e
          bash _cargo.sh "${{ matrix.backend }}" check 2>&1 | tee "$RUNNER_TEMP/check.log" | tail -3
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { bash .github/scripts/annot.sh error "check ${{ matrix.backend }}" "$RUNNER_TEMP/check.log"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs-${{ matrix.name }}
          path: test_logs/
          if-no-files-found: ignore
          retention-days: 14

      # ── scope: say plainly what this job covered (a skipped stage is not a pass) ──
      - name: scope of this job
        if: always()
        run: |
          case "${{ matrix.kind }}" in
            run)   msg="every step of test_runner.sh on ${{ matrix.backend }}. NOT RUN here: #[ignore] tests with real weights, real CUDA / ROCm / Windows-GPU execution" ;;
            build) msg="build (step 01)${{ matrix.only && format(' and step {0}', matrix.only) || ' only' }}. NOT RUN: the models on a GPU (no GPU driver on this runner that gives the CPU's numbers)" ;;
            check) msg="type check only (cargo check). NOT RUN: linking, any test, any kernel on a GPU (no GPU / SDK to link or run)" ;;
          esac
          echo "::notice title=scope ${{ matrix.name }}::$msg"
