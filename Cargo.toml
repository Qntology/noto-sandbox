[workspace]
resolver = "2"
members = [
    "crates/noto-core",
    "crates/noto-data",
    "crates/world-sim",
    "crates/noto-search",
    "crates/noto-quest",
    "crates/noto-runtime",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
lancedb = { version = "0.41", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
rayon = "1"
webp = "0.3"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-rocm = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }

# Tier 0 (Qntology/premium-discount) pinned to PD_LIB_PIN_REV_2
premium-discount-cpu-kernels = { git = "https://github.com/Qntology/premium-discount", rev = "dae2667e498b65e6eb92ca0bd3ebf7e10c75c675" }
premium-discount-eval        = { git = "https://github.com/Qntology/premium-discount", rev = "dae2667e498b65e6eb92ca0bd3ebf7e10c75c675" }
premium-discount-manifest    = { git = "https://github.com/Qntology/premium-discount", rev = "dae2667e498b65e6eb92ca0bd3ebf7e10c75c675" }
premium-discount-nms         = { git = "https://github.com/Qntology/premium-discount", rev = "dae2667e498b65e6eb92ca0bd3ebf7e10c75c675" }
premium-discount-quant       = { git = "https://github.com/Qntology/premium-discount", rev = "dae2667e498b65e6eb92ca0bd3ebf7e10c75c675" }
premium-discount-sds         = { git = "https://github.com/Qntology/premium-discount", rev = "dae2667e498b65e6eb92ca0bd3ebf7e10c75c675", features = ["audit"] }

# Tier 1 (Qntology/louis-vision) pinned to LV_LIB_PIN_REV_2
lv-kernels = { git = "https://github.com/Qntology/louis-vision", rev = "341e54cdc822aa7ee6201fba8f48472df11e1bd6" }
lv-sds     = { git = "https://github.com/Qntology/louis-vision", rev = "341e54cdc822aa7ee6201fba8f48472df11e1bd6" }
lv-core    = { git = "https://github.com/Qntology/louis-vision", rev = "341e54cdc822aa7ee6201fba8f48472df11e1bd6" }
lv-spatial = { git = "https://github.com/Qntology/louis-vision", rev = "341e54cdc822aa7ee6201fba8f48472df11e1bd6" }

[patch.crates-io]
candle-core = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }
candle-nn = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }
candle-flash-attn = { git = "https://github.com/Qntology/candle-rocm-vulkan", rev = "f73415d4d149d7949e8a6a94911af670e4e10f7f" }

[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.tokenizers]
opt-level = 3

[profile.dev.package.world-sim]
opt-level = 3

[profile.dev.package.lv-kernels]
opt-level = 3

[profile.dev.package.lv-spatial]
opt-level = 3

[profile.dev.package.lv-core]
opt-level = 2

[profile.dev.package.premium-discount-cpu-kernels]
opt-level = 3

[profile.dev.package.premium-discount-quant]
opt-level = 3

[profile.dev.package.gemm]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3

[profile.dev.package.pulp]
opt-level = 3

[profile.dev.package.noto-core]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
