[workspace]
resolver = "2"
members = [
    "crates/noto-core",
    "crates/noto-cpu-kernels",
    "crates/noto-ml",
    "crates/noto-data",
    "crates/world-sim",
    "crates/noto-sds",
    "crates/noto-ts",
    "crates/noto-search",
    "crates/noto-quest",
    "crates/noto-vision",
    "crates/noto-runtime",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokenizers = "0.22"
lancedb = { version = "0.31.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
rayon = "1"
webp = "0.3"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"

[patch.crates-io]
candle-core = { git = "https://github.com/sungu-che/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }
candle-nn = { git = "https://github.com/sungu-che/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271" }

[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.tokenizers]
opt-level = 3

[profile.dev.package.world-sim]
opt-level = 3

[profile.dev.package.noto-vision]
opt-level = 3

# The block encoder quantizes the models when they load (a weighted search per 32 weights).
[profile.dev.package.noto-ml]
opt-level = 3

# candle's CPU matmul (and the convolutions the ROCm and Vulkan backends run on the host, im2col + matmul). Unoptimized,
# one TIPSv2 DPT frame took 36 s in the test profile.
[profile.dev.package.gemm]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3

[profile.dev.package.pulp]
opt-level = 3

[profile.dev.package.candle-transformers]
opt-level = 3

[profile.dev.package.noto-core]
opt-level = 3

[profile.dev.package.noto-cpu-kernels]
opt-level = 3

[profile.dev.package.noto-ts]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
