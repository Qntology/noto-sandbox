[package]
name = "noto-ml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SigLIP2 vision-language embeddings on candle, with CUDA, Metal, Vulkan and ROCm device selection"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
half = "2"
tokenizers = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
noto-cpu-kernels = { path = "../noto-cpu-kernels" }
candle-rocm = { git = "https://github.com/sungu-che/candle-rocm-vulkan", rev = "708b2f2bd8797e909038dc9476847d2dfb378271", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"], optional = true }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
vulkan = ["candle-core/vulkan", "candle-nn/vulkan"]
rocm = ["dep:candle-rocm", "dep:windows-sys", "candle-core/rocm", "candle-nn/rocm"]
