[package]
name = "noto-sim-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Noto logistics robot simulator: presets, grasp and drive tests, SigLIP2 classification, Lance dataset"

[lib]
name = "noto_sim_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
noto-core = { path = "../crates/noto-core" }
noto-data = { path = "../crates/noto-data" }
noto-runtime = { path = "../crates/noto-runtime" }
lv-core = { workspace = true }
lv-spatial = { workspace = true }
premium-discount-manifest = { workspace = true }
candle-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg", "png"] }
base64 = "0.22"
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha2 = "0.10"

[features]
default = []
cuda = ["noto-runtime/cuda", "lv-core/cuda"]
metal = ["noto-runtime/metal", "lv-core/metal"]
vulkan = ["noto-runtime/vulkan", "lv-core/vulkan"]
rocm = ["noto-runtime/rocm", "lv-core/rocm"]
